<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FrameFind</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">

        <div class="brand">
            <h1>FrameFind</h1>
            <p>Find the visual world behind every idea.</p>
        </div>

        <form id="search-form">

            <label for="search-input">Search for an image</label>

            <div class="search-box">

                <input
                    id="search-input"
                    type="search"
                    placeholder="Try nature, space, cities..."
                >

                <button id="search-button" type="submit">
                    Search
                </button>

                <button id="clear-button" type="button">
                    Clear
                </button>

            </div>

        </form>

        <div class="chips">

            <button type="button">Nature</button>
            <button type="button">Cities</button>
            <button type="button">Animals</button>
            <button type="button">Space</button>

        </div>

    </header>


    <main>

        <p id="status">
            Search to see results
        </p>

        <section id="results"></section>

    </main>


    <script src="script.js"></script>

</body>

</html>
